spring.application.name=moneymanger

# Postgresql Configuration
spring.datasource.url = ${DB_URL}
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}


# Application Path
server.servlet.context-path=/api/v1.0

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email configuration
spring.mail.host = smtp.gmail.com
spring.mail.port = 587
spring.mail.username = ${GMAIL_USER}
spring.mail.password = ${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${GMAIL_USER}

# JWT Token key
jwt.secret= YOUR_BASE64_SECRET_KEY

# Front End Url
money.manager.frontend.url = ${Frontend_url}

# App Activation Url
app.activation.url = ${Money_Manager_Backend_url}
